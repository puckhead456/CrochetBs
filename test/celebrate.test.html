<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebrate demo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2b2b2f;
    color: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.sub {
    color: #aaa;
    margin: 0 0 24px;
    font-size: 13px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 900px;
  }
  .theme-card {
    background: #38383e;
    border: 1px solid #4a4a52;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .theme-card h2 {
    font-size: 15px;
    margin: 0 0 2px;
  }
  .theme-card .id {
    font-size: 11px;
    color: #999;
    font-family: monospace;
    margin: 0 0 10px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
  }
  button {
    flex: 1;
    padding: 10px 8px;
    border-radius: 8px;
    border: 1px solid #5a5a63;
    background: #4a4a52;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  button:active {
    background: #5a5a63;
  }
  button.stop {
    background: #7a2c2c;
    border-color: #963636;
  }
  .stop-bar {
    margin: 20px 0 0;
    max-width: 900px;
    width: 100%;
  }
  .stop-bar button {
    width: 100%;
  }
  footer {
    margin-top: 24px;
    color: #777;
    font-size: 11px;
  }
</style>
</head>
<body>

  <h1>Celebrate.js demo</h1>
  <p class="sub">Tap a theme's Project or Part button to preview its animation. Dark grey stage on purpose.</p>

  <div class="grid" id="grid"></div>

  <div class="stop-bar">
    <button class="stop" id="stop-btn">Stop current animation</button>
  </div>

  <footer>window.Celebrate.play(themeId, &#123; kind &#125;) — loaded from ../js/celebrate.js</footer>

  <script src="../js/celebrate.js"></script>
  <script>
    'use strict';

    var THEMES = [
      { id: 'stardew-spring', name: 'Pelican Town Spring' },
      { id: 'stardew-night', name: 'Stardrop Night' },
      { id: 'stardew-harvest', name: 'Harvest Festival' },
      { id: 'dragon-fury', name: 'Night Fury' },
      { id: 'dragon-throne', name: 'Fire & Blood' },
      { id: 'dragon-pixel', name: 'Pixel Wyrm' }
    ];

    var grid = document.getElementById('grid');

    THEMES.forEach(function (theme) {
      var card = document.createElement('div');
      card.className = 'theme-card';

      var h2 = document.createElement('h2');
      h2.textContent = theme.name;
      card.appendChild(h2);

      var idEl = document.createElement('p');
      idEl.className = 'id';
      idEl.textContent = theme.id;
      card.appendChild(idEl);

      var row = document.createElement('div');
      row.className = 'btn-row';

      var projBtn = document.createElement('button');
      projBtn.textContent = 'Project 🎉';
      projBtn.addEventListener('click', function () {
        window.Celebrate.play(theme.id, { kind: 'project' });
      });
      row.appendChild(projBtn);

      var partBtn = document.createElement('button');
      partBtn.textContent = 'Part ✨';
      partBtn.addEventListener('click', function () {
        window.Celebrate.play(theme.id, { kind: 'part' });
      });
      row.appendChild(partBtn);

      card.appendChild(row);
      grid.appendChild(card);
    });

    document.getElementById('stop-btn').addEventListener('click', function () {
      window.Celebrate.stop();
    });
  </script>
</body>
</html>
